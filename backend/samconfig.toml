version = 0.1

[default.global.parameters]
stack_name = "heatshield-dev"
region = "us-east-1"
profile = "saurav-cli"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "heatshield-dev"
parameter_overrides = "Stage=dev City=delhi"
tags = "project=heatshield stage=dev"

[default.sync.parameters]
watch = true
