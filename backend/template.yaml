AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HeatShield - ward-level heat risk scores, map API and alerts (serverless)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  City:
    Type: String
    Default: delhi
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "https://heatshield.pages.dev,http://localhost:5173"
    Description: Browser origins allowed to call the API (Cloudflare Pages + local dev)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Layers: [!Ref CommonLayer]
    Environment:
      Variables:
        WARDS_TABLE: !Ref WardsTable
        FORECASTS_TABLE: !Ref RiskForecastsTable
        SUBSCRIBERS_TABLE: !Ref SubscribersTable
        DATA_BUCKET: !Ref DataBucket
        EVENT_BUS_NAME: !Ref EventBus
        CITY: !Ref City
        POWERTOOLS_SERVICE_NAME: heatshield
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------- storage
  WardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub heatshield-${Stage}-wards
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS }
      AttributeDefinitions:
        - { AttributeName: wardId, AttributeType: S }
      KeySchema:
        - { AttributeName: wardId, KeyType: HASH }

  RiskForecastsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub heatshield-${Stage}-risk-forecasts
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS }
      AttributeDefinitions:
        - { AttributeName: wardId, AttributeType: S }
        - { AttributeName: forecastTime, AttributeType: S }
      KeySchema:
        - { AttributeName: wardId, KeyType: HASH }
        - { AttributeName: forecastTime, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub heatshield-${Stage}-subscribers
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS }
      AttributeDefinitions:
        - { AttributeName: phone, AttributeType: S }
        - { AttributeName: wardId, AttributeType: S }
      KeySchema:
        - { AttributeName: phone, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byWard
          KeySchema:
            - { AttributeName: wardId, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub heatshield-${Stage}-data-${AWS::AccountId}
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub heatshield-${Stage}

  # ---------------------------------------------------------------- shared code
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub heatshield-${Stage}-common
      ContentUri: layers/common/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub heatshield-${Stage}-api
      CodeUri: functions/api/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref WardsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RiskForecastsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
      Events:
        ListWards:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /wards }
        WardForecast:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/wards/{wardId}/forecast" }
        Subscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /subscribe }
        Unsubscribe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /unsubscribe }

  WhatsAppWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub heatshield-${Stage}-whatsapp-webhook
      CodeUri: functions/whatsapp_webhook/
      Handler: app.handler
      Events:
        Inbound:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /webhook/whatsapp }

  # ---------------------------------------------------------------- scoring + alerts
  RiskEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub heatshield-${Stage}-risk-engine
      CodeUri: functions/risk_engine/
      Handler: app.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref WardsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RiskForecastsTable }
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
      Events:
        Every3Hours:
          Type: ScheduleV2
          Properties:
            Name: !Sub heatshield-${Stage}-risk-engine
            ScheduleExpression: rate(3 hours)

  AlertDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub heatshield-${Stage}-alert-dispatcher
      CodeUri: functions/alert_dispatcher/
      Handler: app.handler
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref WardsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscribersTable }
      Events:
        ScoresUpdated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [heatshield.risk]
              detail-type: [RiskScoresUpdated]
        Morning:
          Type: ScheduleV2
          Properties:
            Name: !Sub heatshield-${Stage}-alerts-morning
            ScheduleExpression: cron(0 7 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
        Evening:
          Type: ScheduleV2
          Properties:
            Name: !Sub heatshield-${Stage}-alerts-evening
            ScheduleExpression: cron(0 19 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  # ---------------------------------------------------------------- logs (14-day retention)
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ApiFunction}", RetentionInDays: 14 }
  WhatsAppWebhookLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${WhatsAppWebhookFunction}", RetentionInDays: 14 }
  RiskEngineLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${RiskEngineFunction}", RetentionInDays: 14 }
  AlertDispatcherLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${AlertDispatcherFunction}", RetentionInDays: 14 }

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (frontend VITE_API_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DataBucketName:
    Value: !Ref DataBucket
  WardsTableName:
    Value: !Ref WardsTable
  RiskForecastsTableName:
    Value: !Ref RiskForecastsTable
  SubscribersTableName:
    Value: !Ref SubscribersTable
  RiskEngineFunctionName:
    Value: !Ref RiskEngineFunction
  EventBusName:
    Value: !Ref EventBus
