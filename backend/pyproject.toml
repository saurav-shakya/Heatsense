[project]
name = "heatshield-backend"
version = "0.1.0"
description = "HeatShield serverless backend (AWS SAM, Python Lambdas)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "aws-lambda-powertools==3.35.0",
  "boto3",
  "moto[dynamodb,s3,events]>=5",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["layers/common"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["layers/common", "functions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["heatshield"]
